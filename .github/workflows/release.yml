# Temporary #14 integration probe. NEVER merge this branch into main.
# Source gate: main d38d865debc69f5818c4c93007270d7745c0d1e6, copied verbatim.
# Explicit dispatch only; no checkout, secrets, third-party actions or release.
name: B01 security result probe

on:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: probe prerequisite
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Produce successful prerequisite
        run: exit 0

  security:
    name: security
    runs-on: ubuntu-latest
    if: ${{ github.ref != 'refs/heads/ci/b01-security-result-probe' }}
    timeout-minutes: 10
    steps:
      - name: Produce skipped security control
        run: exit 0

  test-gate:
    name: test
    if: ${{ always() }}
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful test and security jobs
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: test "${MATRIX_RESULT}" = "success" && test "${SECURITY_RESULT}" = "success"
